name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm run lint
      - run: npm run build
        env:
          # Shown in the hero: which commit this build came from.
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
          # The API's public URL (Tailscale Funnel), without a trailing slash. Empty until the API
          # is live: set the API_URL repository variable (Settings > Secrets and variables >
          # Actions > Variables), then re-run this workflow on main.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - run: npm test
      # Only builds from main are published. The artifact is the exact out/ that passed the tests.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          working-directory: api
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Builds the API image after its tests pass. Pull requests only build it, to catch a broken
  # Dockerfile; main also publishes it to GHCR, where the laptop pulls it (deploy/update.sh).
  api-image:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jjduques/portfolio-api:latest
            ghcr.io/jjduques/portfolio-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/JJDuqueS/JJDuqueS.github.io
          cache-from: type=gha
          cache-to: type=gha,mode=max
