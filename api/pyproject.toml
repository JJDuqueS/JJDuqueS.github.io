[project]
name = "portfolio-api"
version = "0.1.0"
description = "The API behind jjduques.github.io: health and the contact form."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pydantic[email]>=2.14,<3",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
